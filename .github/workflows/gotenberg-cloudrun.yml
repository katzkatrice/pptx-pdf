name: Gotenberg → GHCR → Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.gotenberg'
      - '.github/workflows/gotenberg-cloudrun.yml'

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gotenberg
  CLOUD_RUN_SERVICE: gotenberg

jobs:
  build-and-push:
    name: Build and push Gotenberg image to GHCR
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        run: echo "image=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gotenberg
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Gotenberg to Cloud Run
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        id: deploy
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ needs.build-and-push.outputs.image }}
          flags: '--memory=1Gi --cpu=1 --min-instances=0 --max-instances=3 --timeout=300 --concurrency=1 --port=8080 --allow-unauthenticated'

      - name: Show Gotenberg URL
        run: echo "GOTENBERG_URL=${{ steps.deploy.outputs.url }}"
